[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimal-fwer"
version = "0.1.0"
description = "Most powerful test with exact family-wise error rate control for K exchangeable hypotheses"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Prasanjit Dubey", email = "pdubey31@gatech.edu"},
    {name = "Xiaoming Huo", email = "huo@gatech.edu"},
]
keywords = [
    "multiple hypothesis testing",
    "family-wise error rate",
    "FWER",
    "optimal testing",
    "elementary symmetric polynomials",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[project.urls]
Companion = "https://arxiv.org/abs/2512.14131"

[tool.setuptools.packages.find]
include = ["general_k*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
